<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="WRF News Snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#1b2440"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <!-- newspaper sheet -->
  <g transform="translate(52 46)">
    <rect x="0" y="0" width="152" height="164" rx="12" fill="#f4f6fb"/>
    <rect x="0" y="0" width="152" height="164" rx="12" fill="none" stroke="#c7cfe2" stroke-width="2"/>
    <!-- masthead -->
    <rect x="18" y="20" width="116" height="20" rx="4" fill="#2b3a67"/>
    <!-- image block -->
    <rect x="18" y="52" width="52" height="40" rx="4" fill="#4f6bd0"/>
    <!-- text lines -->
    <g fill="#8b96b3">
      <rect x="80" y="54" width="54" height="7" rx="3.5"/>
      <rect x="80" y="68" width="54" height="7" rx="3.5"/>
      <rect x="80" y="82" width="40" height="7" rx="3.5"/>
      <rect x="18" y="104" width="116" height="7" rx="3.5"/>
      <rect x="18" y="118" width="116" height="7" rx="3.5"/>
      <rect x="18" y="132" width="80" height="7" rx="3.5"/>
    </g>
  </g>
  <!-- refresh/snapshot badge -->
  <g transform="translate(158 158)">
    <circle cx="30" cy="30" r="34" fill="#3ecf8e"/>
    <path d="M30 12 a18 18 0 1 0 17 12" fill="none" stroke="#0f2a1e" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 8 l6 16 -17 -1 z" fill="#0f2a1e"/>
  </g>
</svg>
